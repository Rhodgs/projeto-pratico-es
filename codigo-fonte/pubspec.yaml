name: jornada_verde
description: Aplicativo educacional gamificado de sustentabilidade
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.4
  carousel_slider: ^4.2.1
  percent_indicator: ^4.2.3
  cached_network_image: ^3.3.0
  flutter_animate: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
