services:
  postgres:
    image: postgres:16
    container_name: projeto-verde-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: projeto_verde
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: projeto-verde-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
